# PyMEOP Config file, YAML
---
settings:
    probe_ip: 129.57.36.81
    meter_ip: 129.57.37.92
    siggen_ip: 129.57.37.95    #91
    lockin_ip: 129.57.37.101
    labjack_ip: 129.57.37.97
    scan_wait: 0.01              # seconds between running scan current change and read
    temp_scan_wait: 0.2         # seconds between temp change and read
    curr_scan_wait: 0.1         # seconds between curr change and read
    event_dir: 'data'
    log_dir: 'log'
    scan_x_axis: 'current'      # X-axis to use for scans, either "current" or "wavelength"
    scan_wave: False              # Do wavelengh reads for running scan?
    baseline_degree: 2          # Baseline under the peaks: 1 straight, 2 quadratic
    slow_dir: 'slowlog'         # slow controls log, a new file each UTC day

# EPICS process variables to show on the Slow Controls tab, log, and record in each event.
# Each PV is read-only unless it has control: true, and a control must have limits.
epics:
    log_interval: 10            # seconds between snapshots of every PV in the slow controls log
    # ca_addr_list: '129.57.255.255'   # set EPICS_CA_ADDR_LIST if broadcast doesn't reach the IOCs
    pvs:
        # Fill in the real PV names, then uncomment:
        # - pv: 'PUMP:LASER:POWER_SP'      # setpoint, the PV that is put to
        #   readback: 'PUMP:LASER:POWER'   # optional, shown beside the setpoint
        #   label: 'Pump laser power'
        #   units: 'W'
        #   format: '.3f'                  # Python format spec for the display
        #   group: 'Pump Laser'            # PVs with the same group share a box on the tab
        #   control: true
        #   limits: [0, 10]                # sets outside these are refused
        # - pv: 'PUMP:LASER:TUNE_V_SP'
        #   readback: 'PUMP:LASER:TUNE_V'
        #   label: 'Wavelength tuning voltage'
        #   units: 'V'
        #   format: '.4f'
        #   group: 'Pump Laser'
        #   control: true
        #   limits: [-5, 5]
        # - pv: 'CELL:TEMP'                # read-only, displayed and logged
        #   label: 'Cell temperature'
        #   units: 'C'
        #   format: '.2f'
        #   group: 'Cell'
